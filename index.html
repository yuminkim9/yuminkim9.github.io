udging materials and communication with local and international participants", "Preparation and presentation support for the speech final at the World Gyeongju Forum", "Coordination of the collected-works publication"]}, {"title": "Project process — Preparing local and overseas presenters", "paragraphs": ["The speech final involved two participants presenting in person from Korea and five joining online from overseas. As the forum schedule did not allow an event-day rehearsal, the local participants rehearsed the day before to review presentation procedures and movement around the venue.", "For overseas participants, I arranged individual Zoom checks around school schedules and time differences. These covered their presentation location, internet connection, audio and screen sharing, as well as the presentation procedures. On the day, I coordinated online connections and the speaking order."]}]}}, "trips": {"ko": {"title": "경주로ON 런트립 · 해파랑길 나이트 힐링트립", "summary": "스마트 관광앱 ‘경주로ON’과 XR버스 콘텐츠를 지역 체험에 연계한 두 프로그램의 기획·홍보·운영을 담당했습니다. 달리기와 역사·문화 체험을 결합한 런트립, 야간 걷기와 문화 콘텐츠를 결합한 힐링트립을 구성하고, 운영 피드백을 후속 기획에 반영했습니다.", "tags": ["참여형 프로그램 기획", "스마트관광 콘텐츠 연계"], "date": "2026.03 ~ 2026.08", "role": "프로그램 기획, 홍보 콘텐츠·운영 자료 작성, 행사 운영", "scope": "경주로ON 스탬프투어·오디오가이드, XR버스 / 프로그램 기획 2건", "lead": "스마트 관광앱 ‘경주로ON’과 XR버스 콘텐츠를 지역 체험에 연계한 두 프로그램입니다. 달리기와 야간 걷기를 중심으로 역사·문화 콘텐츠를 구성하고, 프로그램 기획과 홍보, 운영을 담당했습니다.", "sections": [{"title": "경주로ON 런트립", "paragraphs": ["당시 화제였던 ‘왕과 사는 남자’에서 착안해 ‘왕과 사는 도시, 경주’라는 콘셉트를 프로그램에 반영했습니다. 경주의 주요 관광지를 달리며 역사와 문화를 체험하도록 구성하고, 경주로ON 스탬프투어와 XR버스를 연계했습니다. 참가자 모집과 행사 안내를 위한 홍보물·운영 자료도 작성했습니다."]}, {"title": "해파랑길 나이트 힐링트립", "paragraphs": ["런트립 이후 시청에서 제시한 ‘경주의 다양한 지역 자원 활용’ 의견을 반영해 경주 동해안을 활용했습니다. 양남 주상절리 해안길에 GPS 기반 스탬프투어와 오디오가이드, 만파식적 설화를 활용한 대금 공연, XR버스 콘텐츠를 결합했습니다."]}, {"title": "운영 결과", "paragraphs": ["힐링트립은 양일간 우천에도 146건의 긍정적인 후기가 접수됐으며, 이후 센터에서 낭산을 활용한 후속 프로그램을 논의하는 계기가 됐습니다."]}]}, "en": {"title": "Gyeongju-ro ON Runtrip & Haeparang-gil Night Healing Trip", "summary": "Planned, promoted and operated two programs connecting local experiences with the Gyeongju-ro ON tourism app and XR bus content. The Runtrip combined running with history and culture, while the Healing Trip brought together evening walks and cultural content. Feedback from the first program informed the next.", "tags": ["Participatory program planning", "Smart tourism content integration"], "date": "Mar–Aug 2026", "role": "Program planning, promotional and operational materials, and event operations", "scope": "Gyeongju-ro ON stamp tours and audio guides, XR bus / Two programs", "lead": "Two programs connecting local experiences with the Gyeongju-ro ON tourism app and XR bus content. I worked on planning, promotion and operations, combining running and evening walks with historical and cultural experiences.", "sections": [{"title": "Gyeongju-ro ON Runtrip", "paragraphs": ["Drawing on the popular film “왕과 사는 남자,” we incorporated the concept “Gyeongju, a City Living with Kings” into the program. The route combined running through major landmarks with historical and cultural experiences, linking the Gyeongju-ro ON stamp tour and XR bus. I also prepared promotional and operational materials for recruitment and participant guidance."]}, {"title": "Haeparang-gil Night Healing Trip", "paragraphs": ["After the Runtrip, feedback from the city government encouraged broader use of Gyeongju’s local resources. The next program focused on the east coast, bringing GPS-based stamp missions and audio guides to the Yangnam coastal trail, alongside a daegeum performance inspired by the Manpasikjeok legend and related XR bus content."]}, {"title": "Program outcome", "paragraphs": ["Despite rain on both days, the Healing Trip received 146 positive reviews. The program also prompted discussions at the center about a follow-up experience around Nangsan."]}]}}};

let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ko';
const dialog=document.getElementById('project-dialog'),body=document.getElementById('dialog-body');let lastTrigger=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const t=TEXT[lang];document.documentElement.lang=lang;document.title=t.title;document.querySelectorAll('[data-t]').forEach(el=>{const value=t[el.dataset.t];if(el.dataset.t==='headline')el.innerHTML=value;else el.textContent=value;});document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.getElementById('twisted-tags').innerHTML=t.twistedTags.map(x=>`<span>${esc(x)}</span>`).join('');document.getElementById('profile-photo').src=ASSETS.profile;document.getElementById('project-list').innerHTML=['contest','trips'].map((key,i)=>{const d=PROJECTS[key][lang];return `<article class="project"><span class="project-num" aria-hidden="true">0${i+1}</span><div><h3>${esc(d.title)}</h3>${d.subtitle?`<span class="project-subtitle">${esc(d.subtitle)}</span>`:''}<p>${esc(d.summary)}</p><div class="tags">${d.tags.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div><div class="project-side"><time datetime="2026">2026</time><button type="button" class="info-btn" data-project="${key}" aria-label="${esc(d.title+' '+t.detail)}">${esc(t.detail)}</button></div></article>`;}).join('');}
function showModal(trigger,docs=false){if(!dialog.open)lastTrigger=trigger;dialog.classList.toggle('docs-dialog',docs);document.getElementById('modal-label').textContent=docs?'EDUCATION DOCUMENTS':'PROJECT DETAILS';document.getElementById('close-dialog').setAttribute('aria-label',TEXT[lang].close);if(!dialog.open)dialog.showModal();dialog.scrollTop=0;document.body.style.overflow='hidden';}
function openProject(key,trigger){if(!PROJECTS[key])return;const d=PROJECTS[key][lang],t=TEXT[lang];body.innerHTML=`<h2 id="dialog-title">${esc(d.title)}</h2>${d.subtitle?`<p class="project-subtitle">${esc(d.subtitle)}</p>`:''}<p class="modal-lead">${esc(d.lead)}</p><dl class="facts"><div><dt>${esc(t.date)}</dt><dd>${esc(d.date)}</dd></div><div><dt>${esc(t.organization)}</dt><dd>${esc(t.employer)}</dd></div><div><dt>${esc(t.role)}</dt><dd>${esc(d.role)}</dd></div><div><dt>${esc(t.scope)}</dt><dd>${esc(d.scope)}</dd></div></dl>${d.sections.map(s=>`<h3>${esc(s.title)}</h3>${s.items?`<ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:s.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('')}`).join('')}<h3>${esc(t.press)}</h3><ul class="press-list">${PRESS[key].map(p=>`<li><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer"><span class="press-meta">${esc(lang==='ko'?p.koMedia:p.enMedia)} · ${esc(p.date)}</span><span class="press-title">${esc(lang==='ko'?p.koTitle:p.enTitle)} ↗</span></a></li>`).join('')}</ul>${key==='contest'?`<p class="pending">${esc(t.archive)}<span>${esc(t.pending)}</span></p>`:''}`;showModal(trigger);}
const DOCS=[{key:'dean2020',label:'Autumn 2020'},{key:'dean2021spring',label:'Spring 2021'},{key:'dean2021autumn',label:'Autumn 2021'}];
function openDocument(key,trigger){const t=TEXT[lang];if(key==='dean'){body.innerHTML=`<h2 id="dialog-title">${esc(t.docTitle)}</h2><p class="docs-hint">${esc(t.docsHint)}</p><div class="docs-grid">${DOCS.map(d=>`<button type="button" class="document-tile" data-document="${d.key}" aria-label="${esc(d.label+' — '+t.docTitle)}"><img src="${ASSETS[d.key]}" alt="Dean’s List — ${esc(d.label)}"><span>${esc(d.label)} ↗</span></button>`).join('')}</div>`;}else{const diploma=key==='diploma',d=DOCS.find(x=>x.key===key);if(!diploma&&!d)return;body.innerHTML=`${!diploma?`<button type="button" class="doc-back" data-document="dean">${esc(t.allDocs)}</button>`:''}<h2 id="dialog-title">${esc(diploma?(lang==='ko'?'졸업장':'Diploma'):t.docTitle+' · '+d.label)}</h2><img class="document-image" src="${ASSETS[key]}" alt="${esc(diploma?'University of Washington — Bachelor of Arts, June 7, 2024':'Dean’s List — '+d.label)}">`;}showModal(trigger,true);document.getElementById('close-dialog').focus();}
document.addEventListener('click',e=>{const p=e.target.closest('[data-project]'),d=e.target.closest('[data-document]');if(p)openProject(p.dataset.project,p);if(d)openDocument(d.dataset.document,d);});
document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();});dialog.addEventListener('close',()=>{document.body.style.overflow='';if(lastTrigger?.isConnected)lastTrigger.focus();});
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render();const u=new URL(location.href);if(lang==='en')u.searchParams.set('lang','en');else u.searchParams.delete('lang');try{history.replaceState({},'',u);}catch{}}));render();
</script>
</body>
</html>
